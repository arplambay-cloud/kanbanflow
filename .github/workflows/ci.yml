name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `npm audit` exits 1 both for real findings and for registry failures,
      # and the quick-audit endpoint it uses is being retired — a 500 from npm
      # failed CI on an unrelated pull request, after hanging for five minutes.
      # Parse the report instead, so only actual high/critical vulnerabilities
      # fail the build and an unreachable registry is a warning.
      - name: Audit dependencies
        run: |
          set +e
          report=$(timeout 180 npm audit --json 2>/dev/null)
          set -e

          if ! echo "$report" | jq -e 'has("metadata")' > /dev/null 2>&1; then
            echo "::warning::npm audit returned no report (registry error or timeout); skipping"
            echo "$report" | head -c 500
            exit 0
          fi

          high=$(echo "$report" | jq '.metadata.vulnerabilities.high // 0')
          critical=$(echo "$report" | jq '.metadata.vulnerabilities.critical // 0')
          echo "high=$high critical=$critical"

          if [ "$high" -gt 0 ] || [ "$critical" -gt 0 ]; then
            echo "::error::$critical critical and $high high severity vulnerabilities found"
            echo "$report" | jq '.vulnerabilities | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | {name: .key, severity: .value.severity}'
            exit 1
          fi

      # Guards against the exact regression that shipped in 5999c20: the
      # Cache-Control headers were silently dropped from vercel.json, which
      # re-introduced a blank-page bug caused by a stale index.html.
      - name: Verify vercel.json cache headers are present
        run: |
          node -e "
            const cfg = require('./vercel.json');
            const rules = (cfg.headers || []).flatMap(h => h.headers || []);
            const cacheRules = rules.filter(r => r.key === 'Cache-Control');
            if (cacheRules.length < 2) {
              console.error('FAIL: vercel.json must define Cache-Control for both / and /assets/*');
              process.exit(1);
            }
            const hasNoCache = cacheRules.some(r => /no-store|no-cache/.test(r.value));
            const hasImmutable = cacheRules.some(r => /immutable/.test(r.value));
            if (!hasNoCache || !hasImmutable) {
              console.error('FAIL: need no-cache for HTML and immutable for hashed assets');
              process.exit(1);
            }
            console.log('OK: cache headers present');
          "
